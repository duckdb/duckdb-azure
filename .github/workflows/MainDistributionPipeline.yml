#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, "v[12].[0-9]+-[a-zA-Z]*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    name: Prepare
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      runners: ${{ needs.prepare.outputs.runners }}
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw'

  deploy:
    name: Deploy extension
    needs: build
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      deploy_extensions: azure
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      extension_name: azure
      ci_tools_version: main
      # TODO: format_checks += ;tidy
      format_checks: format
      extra_toolchains: "python3"
